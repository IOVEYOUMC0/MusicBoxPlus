# English overlay for gui-config.yml.
#
# Loaded automatically when the plugin language is English; see GuiConfigOverlay. Only the keys
# listed here are replaced, so this file can grow a screen at a time. A server owner can put their
# own copy in the plugin data folder to override this one.
#
# Covered: every window title, the shared button set, the music editor, the shop and
# publish/confirm screens, the text-display editor, song and playlist items. Anything omitted keeps
# the Chinese default, so this file can keep growing without breaking the base.

# --- Titles ---
gui:
  song-list:
    title: "<gold>Music</gold> <dark_gray>-</dark_gray> <yellow>{container}</yellow> <gray>({page}/{last_page})</gray>"
  textplayer-songs:
    title: "<gold>Text Player Songs</gold> <dark_gray>-</dark_gray> <yellow>{container}</yellow> <gray>({page}/{last_page})</gray>"
  playlists:
    title: "<gold>Playlists</gold> <dark_gray>-</dark_gray> <yellow>{playlist}</yellow> <gray>({page}/{last_page})</gray>"
  playlist-editor:
    title: "<gold>Edit Playlist</gold> <gray>({page}/{last_page})</gray>"
  search-results:
    title: "<gold>Search:</gold> <yellow>{query}</yellow> <gray>({page}/{last_page})</gray>"
  recent-songs:
    title: "<gold>Recently Played</gold> <gray>({page}/{last_page})</gray>"
  sign-setup:
    title: "<gold>Sign Settings</gold> <gray>({page}/{last_page})</gray>"
  control-panel:
    title: "<gold>Control Panel</gold> <dark_gray>-</dark_gray> <yellow>{song}</yellow>"
    progress-bar:
      lore:
        - "<gray>Click to jump to this position</gray>"
edit-menu:
  title: "<gold>Music Edit Menu</gold>"
  buttons:
    create:
      name: "<green>Create Music</green>"
      lore:
        - "<gray>Start a new song</gray>"
        - "<gray>Usage: /musicboxplus edit create <name></gray>"
    select:
      name: "<yellow>Edit Existing Music</yellow>"
      lore:
        - "<gray>Pick a song to edit</gray>"
        - "<gray>Usage: /musicboxplus edit select <name></gray>"
    delete:
      name: "<red>Delete Music</red>"
      lore:
        - "<gray>Remove a song</gray>"
        - "<gray>Usage: /musicboxplus edit delete <name></gray>"
    rename:
      name: "<yellow>Rename Music</yellow>"
      lore:
        - "<gray>Pick a song and enter a new name</gray>"
        - "<gray>Usage: /musicboxplus edit rename <old> <new></gray>"
    list:
      name: "<aqua>Music List</aqua>"
      lore:
        - "<gray>Show every song</gray>"
    import:
      name: "<light_purple>Import Music File</light_purple>"
      lore:
        - "<gray>Import from an NBS or MIDI file</gray>"
        - "<gray>Usage: /musicboxplus edit import <file></gray>"
        - "<gray>Supports .nbs / .mid / .midi</gray>"
        - "<gray>The file must be in the plugin folder</gray>"
    export:
      name: "<aqua>Export as NBS</aqua>"
      lore:
        - "<gray>Write the current song to an NBS file</gray>"
    back:
      name: "<red>Back</red>"
      lore:
        - "<gray>Click to go back</gray>"
paste-preview:
