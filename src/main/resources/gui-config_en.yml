# English overlay for gui-config.yml.
#
# Loaded automatically when the plugin language is English; see GuiConfigOverlay. Only the keys
# listed here are replaced, so this file can grow a screen at a time. A server owner can put their
# own copy in the plugin data folder to override this one.
#
# Covered so far: every GUI title and the shared button set (names and lore). Screen-specific
# sections (song items, playlist items, per-screen lore) still fall back to the Chinese defaults.

# --- Titles ---
edit-menu:
  title: "<gold>Music Edit Menu</gold>"
paste-preview:
  title: "<gold>Paste Preview: {count} notes</gold>"
shop-container-purchase-confirm:
  title: "<gold>Buy Folder: {folder}</gold>"
volume-control:
  title: "<gold>Volume</gold>"
music-editor:
  title: "<gold>Music Editor</gold> <dark_gray>-</dark_gray> <yellow>{name}</yellow>"
music-select:
  title: "<gold>Select Music to Edit</gold>"
settings-menu:
  title: "<gold>Music Settings</gold> <dark_gray>-</dark_gray> <yellow>{name}</yellow>"
bpm-settings:
  title: "<gold>BPM Settings</gold> <dark_gray>-</dark_gray> <yellow>{name}</yellow>"
publish-gui:
  title: "<gold>Publish Music</gold>"
publish-confirm:
  title: "<gold>Publish: {name}</gold>"
delete-confirm:
  title: "<red>Confirm Delete: {name}</red>"
purchase-confirm:
  title: "<gold>Purchase: {name}</gold>"
manage-published:
  title: "<gold>Manage: {name}</gold>"
publish-review:
  title: "<gold>Publish Review</gold>"
text-player-edit:
  title: "<gold>Text Player</gold> <dark_gray>-</dark_gray> <yellow>{name}</yellow>"
player-shop:
  title: "<gold>Player Music Shop</gold>"
search:
  title: "<gold>Search</gold>"
exit-confirm:
  title: "<red>Unsaved Changes</red>"

# --- Shared buttons ---
