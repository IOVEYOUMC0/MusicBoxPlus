# =====================================================
# 音乐编辑器 GUI
# =====================================================

music-editor:
  # GUI 标题
  title: "<gold>音乐编辑器</gold> <dark_gray>-</dark_gray> <yellow>{name}</yellow>"
  
  # 整体布局（箱子 6 行 + 玩家背包 4 行 = 10 行）
  # 前 6 行是编辑区域，后 4 行是玩家背包与功能按钮
  layout: |
    EEEEEEEEE
    EEEEEEEEE
    EEEEEEEEE
    EEEEEEEEE
    EEEEEEEEE
    EEEEEEEEE
    BTMGXXXXC
    YZQWJKXXX
    XXXXXXXXX
    UDLRIPSHX
  
  # 按钮字符映射
  button-mapping:
    edit-area: "E"        # 编辑区域
    empty: "X"            # 空位
    # 快捷栏按钮(最后一行) - 导航和常用操作
    pitch-up: "U"         # 音高上移
    pitch-down: "D"       # 音高下移
    tick-left: "L"        # 拍位左移
    tick-right: "R"       # 拍位右移
    instrument: "I"       # 切换乐器
    play: "P"             # 播放/停止
    save: "S"             # 保存音乐
    exit: "H"             # 退出编辑
    # 背包第一行 - 设置按钮
    bpm-up: "B"           # BPM+5
    bpm-down: "T"         # BPM-5
    time-signature: "M"   # 节拍切换
    settings: "G"         # 编辑设置
    clear-all: "C"        # 清空音符
    # 背包第三行 - 撤销/重做/复制/粘贴
    undo: "Y"             # 撤销
    redo: "Z"             # 重做
    copy: "Q"             # 复制选中
    paste: "J"            # 粘贴
    delete-selection: "K" # 删除选中
    batch-instrument: "W" # 批量修改乐器
    cancel: "A"           # 取消
  
  buttons:
    pitch-up:
      material: "LIME_STAINED_GLASS_PANE"
      name: "<green>音高上移</green>"
      lore:
        - "<gray>当前音区: </gray><yellow>{pitchRange}</yellow>"
        - "<gray>音高偏移: </gray><dark_gray>{pitchOffset}</dark_gray>"
        - "<dark_gray>向上查看更高音区</dark_gray>"
      custom-model-data: 0
    pitch-down:
      material: "RED_STAINED_GLASS_PANE"
      name: "<red>音高下移</red>"
      lore:
        - "<gray>当前音区: </gray><yellow>{pitchRange}</yellow>"
        - "<gray>音高偏移: </gray><dark_gray>{pitchOffset}</dark_gray>"
        - "<dark_gray>向下查看更低音区</dark_gray>"
      custom-model-data: 0
    tick-left:
      material: "YELLOW_STAINED_GLASS_PANE"
      name: "<yellow>拍位左移</yellow>"
      lore:
        - "<gray>当前拍位: </gray><yellow>{tickRange}</yellow>"
        - "<gray>时间页: </gray><dark_gray>{tickOffset}</dark_gray>"
        - "<dark_gray>向前移动时间线</dark_gray>"
      custom-model-data: 0
    tick-right:
      material: "BLUE_STAINED_GLASS_PANE"
      name: "<blue>拍位右移</blue>"
      lore:
        - "<gray>当前拍位: </gray><yellow>{tickRange}</yellow>"
        - "<gray>时间页: </gray><dark_gray>{tickOffset}</dark_gray>"
        - "<dark_gray>向后移动时间线</dark_gray>"
      custom-model-data: 0
    instrument:
      material: "NOTE_BLOCK"
      name: "<aqua>当前乐器</aqua>"
      lore:
        - "<gray>当前: </gray><white>{instrument}</white>"
        - "<dark_gray>点击选择用于新音符的乐器</dark_gray>"
      custom-model-data: 0
    play:
      material: "JUKEBOX"
      name: "<green>播放</green>"
      lore:
        - "<gray>音符数: </gray><yellow>{notes}</yellow>"
      custom-model-data: 0
    play-stop:
      material: "BARRIER"
      name: "<red>停止播放</red>"
      lore:
        - "<gray>音符数: </gray><yellow>{notes}</yellow>"
      custom-model-data: 0
    save:
      material: "WRITABLE_BOOK"
      name: "<green>保存音乐</green>"
      lore:
        - "<gray>点击保存当前编辑</gray>"
        - "<dark_gray>自动保存失败时可手动保存</dark_gray>"
      custom-model-data: 0
    exit:
      material: "BARRIER"
      name: "<red>退出编辑</red>"
      lore:
        - "<gray>点击退出编辑</gray>"
        - "<dark_gray>有未保存内容时会弹出确认</dark_gray>"
      custom-model-data: 0
    empty:
      material: "GRAY_STAINED_GLASS_PANE"
      name: "<dark_gray>空位</dark_gray>"
      lore:
        - "<dark_gray>工具栏占位</dark_gray>"
      custom-model-data: 0
    bpm-up:
      material: "LIME_DYE"
      name: "<green>BPM +5</green>"
      lore:
        - "<gray>当前BPM: </gray><yellow>{bpm}</yellow>"
        - "<gray>范围: 20-300</gray>"
      custom-model-data: 0
    bpm-down:
      material: "RED_DYE"
      name: "<red>BPM -5</red>"
      lore:
        - "<gray>当前BPM: </gray><yellow>{bpm}</yellow>"
        - "<gray>范围: 20-300</gray>"
      custom-model-data: 0
    time-signature:
      material: "CLOCK"
      name: "<aqua>拍号: </aqua><yellow>{timeSignature}</yellow>"
      lore:
        - "<dark_gray>点击切换拍号</dark_gray>"
      custom-model-data: 0
    settings:
      material: "COMPASS"
      name: "<aqua>编辑设置</aqua>"
      lore:
        - "<gray>BPM: </gray><yellow>{bpm}</yellow>"
        - "<gray>拍号: </gray><yellow>{timeSignature}</yellow>"
        - "<gray>细分: </gray><yellow>{subdivision}</yellow>"
        - "<gray>音符数: </gray><yellow>{notes}</yellow>"
        - "<gray>视图: </gray><yellow>{pitchRange}</yellow> <dark_gray>/</dark_gray> <yellow>{tickRange}</yellow>"
        - "<dark_gray>点击打开设置、重命名和发布入口</dark_gray>"
      custom-model-data: 0
    clear-all:
      material: "TNT"
      name: "<red>清空音符</red>"
      lore:
        - "<dark_gray>点击清空所有音符</dark_gray>"
        - "<red>此操作不可撤销!</red>"
      custom-model-data: 0
    undo:
      material: "ARMOR_STAND"
      name: "<yellow>撤销</yellow>"
      lore:
        - "<gray>可用: {canUndo}</gray>"
        - "<dark_gray>点击撤销上一步</dark_gray>"
      custom-model-data: 0
    redo:
      material: "END_CRYSTAL"
      name: "<aqua>重做</aqua>"
      lore:
        - "<gray>可用: {canRedo}</gray>"
        - "<dark_gray>点击重做上一步</dark_gray>"
      custom-model-data: 0
    copy:
      material: "WRITTEN_BOOK"
      name: "<green>复制</green>"
      lore:
        - "<gray>选中数量: </gray><yellow>{selectionCount}</yellow>"
        - "<dark_gray>先 Shift+点击选择区域</dark_gray>"
        - "<dark_gray>再点击复制选中音符</dark_gray>"
      custom-model-data: 0
    paste:
      material: "BOOK"
      name: "<gold>粘贴</gold>"
      lore:
        - "<gray>剪贴板: </gray><yellow>{clipboardSize}</yellow> <gray>个音符</gray>"
        - "<dark_gray>粘贴到当前视图中心附近</dark_gray>"
      custom-model-data: 0
    delete-selection:
      material: "TNT"
      name: "<red>删除选中</red>"
      lore:
        - "<gray>选中数量: </gray><yellow>{selectionCount}</yellow>"
        - "<dark_gray>先 Shift+点击选择区域</dark_gray>"
        - "<dark_gray>删除当前选中的音符</dark_gray>"
      custom-model-data: 0
    batch-instrument:
      material: "GOLD_BLOCK"
      name: "<yellow>批量修改乐器</yellow>"
      lore:
        - "<gray>选中数量: </gray><yellow>{selectionCount}</yellow>"
        - "<gray>当前乐器: </gray><white>{instrument}</white>"
        - "<dark_gray>先选择区域，再统一改为当前乐器</dark_gray>"
      custom-model-data: 0
    cancel:
      material: "BARRIER"
      name: "<red>取消</red>"
      custom-model-data: 0
  
  # GUI内部元素配置
  gui:
    empty-slot:
      material: "GRAY_STAINED_GLASS_PANE"
      name: "<gray>空位</gray>"
      lore:
        - "<gray>音高: </gray><white>{note}</white>"
        - "<gray>拍位: </gray><yellow>{tick}</yellow>"
        - "<green>左键 </green><gray>添加音符</gray>"
        - "<aqua>Shift+点击 </aqua><gray>开始/扩展选择</gray>"
      custom-model-data: 0
    empty-slot-selected:
      material: "LIGHT_BLUE_STAINED_GLASS_PANE"
      name: "<aqua>★ </aqua><gray>空位</gray> <aqua>(已选中)</aqua>"
      lore:
        - "<gray>音高: </gray><white>{note}</white>"
        - "<gray>拍位: </gray><yellow>{tick}</yellow>"
        - "<aqua>已选中</aqua>"
      custom-model-data: 0
    playing-empty-slot:
      material: "GREEN_STAINED_GLASS_PANE"
      name: "<green>播放中</green>"
      lore:
        - "<gray>音高: </gray><white>{note}</white>"
        - "<gray>拍位: </gray><yellow>{tick}</yellow>"
        - "<green>★ 正在播放</green>"
      custom-model-data: 0
    filled-note:
      material: "NOTE_BLOCK"
      # true 时音符图标使用该音符乐器对应的音符盒底部方块；false 时使用上方 material
      use-instrument-material: true
      name: "<green>{note}</green>"
      lore:
        - "<gray>乐器: </gray><white>{instrument}</white>"
        - "<gray>拍位: </gray><yellow>{tick}</yellow>"
        - "<aqua>左键 </aqua><gray>编辑乐器</gray>"
        - "<red>右键 </red><gray>删除音符</gray>"
        - "<aqua>Shift+点击 </aqua><gray>开始/扩展选择</gray>"
      custom-model-data: 0
      glow: true
    filled-note-selected:
      material: "NOTE_BLOCK"
      use-instrument-material: true
      name: "<aqua>★ </aqua><green>{note}</green>"
      lore:
        - "<gray>乐器: </gray><white>{instrument}</white>"
        - "<gray>拍位: </gray><yellow>{tick}</yellow>"
        - "<aqua>已选中</aqua>"
        - "<aqua>左键 </aqua><gray>编辑乐器</gray>"
        - "<red>右键 </red><gray>删除音符</gray>"
      custom-model-data: 0
      glow: true
    multi-instrument:
      material: "NOTE_BLOCK"
      # 多乐器音符默认使用第一个乐器的对应方块
      use-instrument-material: true
      name: "<yellow>多重乐器</yellow> <gray>({count})</gray>"
      lore:
        - "<gray>音符: </gray><white>{note}</white>"
        - "<gray>拍位: </gray><yellow>{tick}</yellow>"
        - "<gray>乐器列表:</gray>"
        - "{instruments}"
        - "<aqua>左键 </aqua><gray>选择编辑</aqua>"
        - "<red>右键 </red><gray>删除音符</gray>"
        - "<aqua>Shift+点击 </aqua><gray>开始/扩展选择</gray>"
      custom-model-data: 0
    multi-instrument-selected:
      material: "NOTE_BLOCK"
      use-instrument-material: true
      name: "<aqua>★ </aqua><yellow>多重乐器</yellow> <gray>({count})</gray>"
