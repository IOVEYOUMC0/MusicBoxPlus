# =====================================================
# 全局设置
# =====================================================

# GUI 标题关键词
# 用于识别插件打开的 GUI，并在重载或切换流程中安全关闭相关 GUI
gui-title-keywords:
  - "MusicBox"
  - "Playlist"
  - "Control"
  - "Volume"
  - "Search"
  - "播放列表"
  - "控制"
  - "音量"
  - "搜索"
  - "歌曲"
  - "Song"
  - "Sign"
  - "编辑器"

# =====================================================
# 编辑菜单
# =====================================================
edit-menu:
  title: "<gold>音乐编辑菜单</gold>"
  layout: |
    XXXCXXXXX
    XSXDXRXXX
    XXXLIEXXX
    XXXXBXXXX
  button-mapping:
    create: "C"
    select: "S"
    delete: "D"
    rename: "R"
    list: "L"
    import: "I"
    export: "E"
    back: "B"
  buttons:
    create:
      material: "EMERALD"
      name: "<green>创建新音乐</green>"
      lore:
        - "<gray>创建一首新的音乐</gray>"
        - "<gray>用法: /musicboxplus edit create <名称></gray>"
      custom-model-data: 0
    select:
      material: "NOTE_BLOCK"
      name: "<yellow>选择音乐编辑</yellow>"
      lore:
        - "<gray>选择已有音乐进行编辑</gray>"
        - "<gray>用法: /musicboxplus edit select <名称></gray>"
      custom-model-data: 0
    delete:
      material: "REDSTONE"
      name: "<red>删除音乐</red>"
      lore:
        - "<gray>删除一首音乐</gray>"
        - "<gray>用法: /musicboxplus edit delete <名称></gray>"
      custom-model-data: 0
    rename:
      material: "NAME_TAG"
      name: "<yellow>重命名音乐</yellow>"
      lore:
        - "<gray>选择一首音乐并输入新名称</gray>"
        - "<gray>用法: /musicboxplus edit rename <旧名称> <新名称></gray>"
      custom-model-data: 0
    list:
      material: "BOOK"
      name: "<aqua>音乐列表</aqua>"
      lore:
        - "<gray>查看所有音乐</gray>"
      custom-model-data: 0
    import:
      material: "MUSIC_DISC_CAT"
      name: "<light_purple>导入音乐文件</light_purple>"
      lore:
        - "<gray>从 NBS 或 MIDI 文件导入音乐</gray>"
        - "<gray>用法: /musicboxplus edit import <文件名></gray>"
        - "<gray>支持 .nbs / .mid / .midi</gray>"
        - "<gray>文件放在插件目录中</gray>"
      custom-model-data: 0
    export:
      material: "MUSIC_DISC_11"
      name: "<aqua>导出为 NBS</aqua>"
      lore:
        - "<gray>导出当前音乐为 NBS 文件</gray>"
      custom-model-data: 0
    back:
      material: "BARRIER"
      name: "<red>返回</red>"
      lore:
        - "<gray>点击返回</gray>"
      custom-model-data: 0

# =====================================================
# 粘贴预览界面
# =====================================================
paste-preview:
  title: "<gold>粘贴预览: {count}个音符</gold>"
  layout: |
    XXXXIXXXX
    XXXXCXXXX
    XXXXBXXXX
  button-mapping:
    info: "I"
    confirm: "C"
    cancel: "B"
  buttons:
    info:
      material: "BOOK"
      name: "<yellow>信息</yellow>"
      lore:
        - "<gray>确认或取消下方的粘贴操作</gray>"
      custom-model-data: 0
    confirm:
      material: "LIME_STAINED_GLASS_PANE"
      name: "<green>确认粘贴</green>"
      lore:
        - "<gray>粘贴剪贴板中的音符</gray>"
      custom-model-data: 0
    cancel:
      material: "RED_STAINED_GLASS_PANE"
      name: "<red>取消</red>"
      lore:
        - "<gray>取消粘贴操作</gray>"
      custom-model-data: 0

# =====================================================
# 清空确认界面（玩家背包显示）
# =====================================================
clear-confirm:
  button-mappings:
    confirm: 0
    info: 4
    cancel: 8
  buttons:
    info:
      material: "BOOK"
      name: "<yellow>警告</yellow>"
      lore:
        - "<gray>将删除 <red>{count}</red> <gray>个音符</gray>"
        - "<red>此操作不可撤销!</red>"
      custom-model-data: 0
    confirm:
      material: "RED_STAINED_GLASS_PANE"
      name: "<red>确认清空</red>"
      lore:
        - "<gray>点击确认清空所有音符</gray>"
      custom-model-data: 0
    cancel:
      material: "LIME_STAINED_GLASS_PANE"
      name: "<green>取消</green>"
      lore:
        - "<gray>点击取消操作</gray>"
      custom-model-data: 0

# =====================================================
# GUI 布局配置
# =====================================================

gui:
  # 主歌曲列表 GUI
  song-list:
    rows: 6
    title: "<gold>音乐</gold> <dark_gray>-</dark_gray> <yellow>{container}</yellow> <gray>({page}/{last_page})</gray>"
    
    # 按钮字符映射
    # 可自定义布局字符，请避免重复字符
    button-mapping:
      songs: "S"           # 歌曲区域
      previous: "P"        # 上一页
      next: "N"            # 下一页
      parent: "F"          # 父目录
      search: "H"          # 搜索
      control-panel: "C"   # 控制面板
      playlist: "L"        # 播放列表
      stop: "T"            # 停止
      volume: "V"          # 音量
      speed: "Y"           # 播放速度
      recent-songs: "R"    # 最近播放
      play-pause: "A"      # 播放/暂停
      play-mode: "M"       # 播放模式（静音/扬声器）
      empty: "X"           # 空位
    
    layout: |
      FXXXHXXXR
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      PYVCATLMN

  # 文字播放器选歌 GUI
  textplayer-songs:
    rows: 6
    title: "<gold>文字播放器选歌</gold> <dark_gray>-</dark_gray> <yellow>{container}</yellow> <gray>({page}/{last_page})</gray>"

    button-mapping:
      songs: "S"
      previous: "P"
      next: "N"
      parent: "F"
      search: "H"
      empty: "X"

    layout: |
      FXXXHXXXX
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      PXXXXXXXN

  # 播放列表编辑器 GUI
  playlist-editor:
    rows: 6
    title: "<gold>播放列表</gold> <dark_gray>-</dark_gray> <yellow>{playlist}</yellow> <gray>({page}/{last_page})</gray>"
    
    # 按钮字符映射
    button-mapping:
      songs: "S"           # 歌曲区域
      back: "B"            # 上一页
      next: "N"            # 下一页
      add: "A"             # 添加
      delete: "D"          # 删除
      shuffle: "H"         # 随机
      save: "V"            # 保存
      return: "R"          # 返回列表
      empty: "X"           # 空位
    
    layout: |
      XXXXXXXXX
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      BXADHVRXN

  # 播放列表列表 GUI
  playlist-list:
    rows: 6
    title: "<gold>播放列表编辑</gold> <gray>({page}/{last_page})</gray>"
    
    # 按钮字符映射
    button-mapping:
      playlist: "P"       # 播放列表页
      back: "B"           # 返回主菜单
      previous: "G"       # 上一页
      next: "N"           # 下一页
      empty: "X"          # 空位
      create: "C"         # 创建
      master: "M"         # 主播放列表
      close: "L"          # 关闭
    
    layout: |
      XXXXXXXXX
      XPPPPPPPX
      XPPPPPPPX
      XPPPPPPPX
      XPPPPPPPX
      BGXXCMXNL

  # 搜索结果 GUI
  search-results:
    rows: 6
    title: "<gold>搜索:</gold> <yellow>{query}</yellow> <gray>({page}/{last_page})</gray>"
    
    # 按钮字符映射
    button-mapping:
      results: "R"        # 结果页
      back: "B"           # 返回菜单
      previous: "P"       # 上一页
      next: "N"           # 下一页
      empty: "X"          # 空位
    
    layout: |
      XXXXXXXXX
      XRRRRRRRX
      XRRRRRRRX
      XRRRRRRRX
      XRRRRRRRX
      BXXPXXNXX

  # 最近播放 GUI
  recent-songs:
    rows: 6
    title: "<gold>最近播放</gold> <gray>({page}/{last_page})</gray>"
    
    # 按钮字符映射
    button-mapping:
      songs: "S"          # 歌曲页
      back: "B"           # 返回菜单
      previous: "P"       # 上一页
      next: "N"           # 下一页
      empty: "X"          # 空位
    
    layout: |
      XXXXXXXXX
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      BXXPXXNXX

  # 告示牌设置界面 GUI
  sign-setup:
    rows: 6
    title: "<gold>告示牌设置</gold> <gray>({page}/{last_page})</gray>"
    
    # 按钮字符映射
    button-mapping:
      songs: "S"           # 歌曲区域
      previous: "P"        # 上一页
      next: "N"            # 下一页
      parent: "B"          # 返回上级目录
      prevent-destroy: "D" # 防止破坏
      info-sign: "I"       # 信息按钮
      random: "R"          # 随机按钮
      playlist: "L"        # 播放列表编辑器
      search: "F"          # 搜索
      recent-songs: "H"    # 最近播放
      empty: "X"           # 空位
    
    layout: |
      BXXXFXXXH
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      XSSSSSSSX
      PXIRXDLXN

  # 控制面板GUI
  control-panel:
    rows: 3
    title: "<gold>控制面板</gold> <dark_gray>-</dark_gray> <yellow>{song}</yellow>"
    
    # 按钮字符映射
    button-mapping:
      progress: "P"           # 进度条
      song-list: "S"          # 歌曲列表
      back: "B"               # 返回
      play-pause: "A"         # 播放/暂停
      stop: "T"               # 停止
      loop: "L"               # 循环
      volume: "V"             # 音量
      speed: "Y"              # 播放速度
      protect: "K"            # 防止破坏（告示牌专用）
      empty: "X"              # 空位
    
    # 布局模式
    # 第一行: P=进度条（代码中固定槽位0-8）
    # 第二行: S=歌曲列表（代码中固定槽位9-17）
    # 第三行: 按钮栏
    layout: |
      PPPPPPPPP
      SSSSSSSSS
      XBKVAYTLX
    
    progress-bar:
      enabled: true
      row: 0
      start-col: 0
      end-col: 9
      # 进度状态材质
      material-unplayed: "GRAY_STAINED_GLASS_PANE"
      material-unplayed-model-data: 0
      material-playing: "WHITE_STAINED_GLASS_PANE"
      material-playing-model-data: 0
      material-halfway: "LIME_STAINED_GLASS_PANE"
      material-halfway-model-data: 0
      material-played: "GREEN_STAINED_GLASS_PANE"
      material-played-model-data: 0
      # 进度显示格式
      format: "<yellow>{percent}%</yellow> <gray>- {time}</gray>"
      lore:
        - "<gray>点击跳转到此位置</gray>"

# =====================================================
# 按钮配置
# =====================================================

buttons:
  # GUI 导航按钮
  previous:
    material: "ARROW"
    name: "<gold>上一页</gold>"
    lore:
      - "<gray>点击翻到上一页</gray>"
    custom-model-data: 0

  next:
    material: "ARROW"
    name: "<gold>下一页</gold>"
    lore:
      - "<gray>点击翻到下一页</gray>"
    custom-model-data: 0

  back:
    material: "ARROW"
    name: "<gold>返回</gold>"
    lore:
      - "<gray>点击返回</gray>"
    custom-model-data: 0

  parent-folder:
    material: "TORCH"
    name: "<gold>返回上级目录</gold>"
    custom-model-data: 0

  parent:
    material: "TORCH"
    name: "<gold>返回上级目录</gold>"
    lore:
      - "<gray>点击返回上级目录</gray>"
    custom-model-data: 0

  close:
    material: "BARRIER"
    name: "<red>关闭</red>"
    lore:
      - "<gray>点击关闭</gray>"
    custom-model-data: 0

  # 音乐控制按钮
  play:
    material: "EMERALD_BLOCK"
    name: "<green>播放</green>"
    lore:
      - "<gray>点击恢复当前播放</gray>"
    custom-model-data: 0

  pause:
    material: "REDSTONE_BLOCK"
    name: "<red>暂停</red>"
    lore:
      - "<gray>点击暂停当前播放</gray>"
    custom-model-data: 0

  playback-unavailable:
    material: "GRAY_DYE"
    name: "<gray>此功能不可用</gray>"
    lore:
      - "<gray>原版自定义唱片使用的是原版唱片机播放。</gray>"
      - "<gray>因此这里无法可靠地暂停或跳转进度。</gray>"
    custom-model-data: 0

  playback-unavailable-pause:
    material: "GRAY_DYE"
    name: "<gray>此功能不可用</gray>"
    lore:
      - "<gray>原版自定义唱片使用的是原版唱片机播放。</gray>"
      - "<gray>因此这里无法可靠地暂停或恢复播放。</gray>"
    custom-model-data: 0

  playback-unavailable-loop:
    material: "GRAY_DYE"
    name: "<gray>此功能不可用</gray>"
    lore:
      - "<gray>原版自定义唱片使用的是原版唱片机播放。</gray>"
      - "<gray>因此这里无法可靠地控制循环模式。</gray>"
    custom-model-data: 0

  playback-unavailable-progress:
    material: "GRAY_STAINED_GLASS_PANE"
    name: "<gray>进度不可用</gray>"
    lore:
      - "<gray>原版自定义唱片不会向插件暴露可靠进度。</gray>"
      - "<gray>因此这里无法安全地跳转播放位置。</gray>"
    custom-model-data: 0

  # 模式切换按钮
  play-mode:
    material: "NOTE_BLOCK"
    name: "<gold>播放模式</gold>"
    lore:
      - "<gray>当前播放模式状态</gray>"
      - "<yellow>静音: {silent}</yellow>"
      - "<yellow>扬声器: {speaker}</yellow>"
      - "<reset>"
      - "<yellow>左键: 切换静音</yellow>"
      - "<yellow>右键: 切换扬声器</yellow>"
    custom-model-data: 0

  play-mode-normal:
    material: "NOTE_BLOCK"
    name: "<gold>播放模式</gold>"
    lore:
      - "<gray>当前播放模式状态：</gray>"
      - "<yellow>静音: {silent}</yellow>"
      - "<yellow>扬声器: {speaker}</yellow>"
      - "<reset>"
      - "<yellow>左键: 切换静音</yellow>"
      - "<yellow>右键: 切换扬声器</yellow>"
    custom-model-data: 0

  play-mode-silent:
    material: "GRAY_DYE"
    name: "<gold>播放模式</gold>"
    lore:
      - "<gray>当前播放模式状态：</gray>"
      - "<yellow>静音: {silent}</yellow>"
      - "<yellow>扬声器: {speaker}</yellow>"
      - "<reset>"
      - "<yellow>左键: 切换静音</yellow>"
      - "<yellow>右键: 切换扬声器</yellow>"
    custom-model-data: 0

  play-mode-speaker:
    material: "JUKEBOX"
    name: "<gold>播放模式</gold>"
    lore:
      - "<gray>当前播放模式状态：</gray>"
      - "<yellow>静音: {silent}</yellow>"
      - "<yellow>扬声器: {speaker}</yellow>"
      - "<reset>"
      - "<yellow>左键: 切换静音</yellow>"
      - "<yellow>右键: 切换扬声器</yellow>"
    custom-model-data: 0

  speaker-mode:
    material: "JUKEBOX"
    name: "<gold>扬声器模式：{status}</gold>"
    lore:
      - "<gray>点击切换扬声器模式</gray>"
      - "<gray>当前：{status}</gray>"
    custom-model-data: 0

  speaker-mode-on:
    material: "JUKEBOX"
    name: "<gold>扬声器模式：{status}</gold>"
    lore:
      - "<gray>点击切换扬声器模式</gray>"
      - "<gray>当前：{status}</gray>"
    custom-model-data: 0

  speaker-mode-off:
    material: "NOTE_BLOCK"
    name: "<gold>扬声器模式：{status}</gold>"
    lore:
      - "<gray>点击切换扬声器模式</gray>"
      - "<gray>当前：{status}</gray>"
    custom-model-data: 0

  speaker-mode-no-permission:
    material: "BARRIER"
    name: "<gold>扬声器模式：{status}</gold>"
    lore:
      - "<red>你没有使用扬声器的权限。</red>"
    custom-model-data: 0

  # 播放列表按钮
  playlist:
    material: "BOOK"
    name: "<gold>播放列表</gold>"
    lore:
      - "<gray>点击打开播放列表</gray>"
    custom-model-data: 0

  # 控制面板按钮
  control-panel:
    material: "REDSTONE_TORCH"
    name: "<gold>控制面板</gold>"
    lore:
      - "<gray>点击打开控制面板</gray>"
    custom-model-data: 0

  control-panel-playing:
    material: "REDSTONE_TORCH"
    name: "<gold>控制面板</gold>"
    lore:
      - "<gray>播放状态：<yellow>{status}</yellow></gray>"
      - ""
      - "<yellow>左键: 打开面板</yellow>"
    custom-model-data: 0

  control-panel-paused:
    material: "LEVER"
    name: "<gold>控制面板</gold>"
    lore:
      - "<gray>播放状态：<yellow>{status}</yellow></gray>"
      - ""
      - "<yellow>左键: 打开面板</yellow>"
    custom-model-data: 0

  # 循环模式按钮（三种状态独立配置）
  loop-mode-off:
    material: "REDSTONE"
    name: "<gold>循环模式: </gold><red>关闭</red>"
    lore:
      - "<gray>点击切换循环模式</gray>"
      - "<gray>当前: </gray><red>关闭</red>"
    custom-model-data: 0

  loop-mode-single:
    material: "REPEATER"
    name: "<gold>循环模式: </gold><yellow>单曲循环</yellow>"
    lore:
      - "<gray>点击切换循环模式</gray>"
      - "<gray>当前: </gray><yellow>单曲循环</yellow>"
    custom-model-data: 0

  loop-mode-all:
    material: "COMPARATOR"
    name: "<gold>循环模式: </gold><green>列表循环</green>"
    lore:
      - "<gray>点击切换循环模式</gray>"
      - "<gray>当前: </gray><green>列表循环</green>"
    custom-model-data: 0

  # 防止破坏按钮（告示牌专用）
  protect-enabled:
    material: "SHIELD"
    name: "<green>防止破坏: 开启</green>"
    lore:
      - "<gray>当前状态: </gray><green>开启</green>"
      - "<gray>点击切换防止破坏模式</gray>"
      - "<yellow>再次点击可关闭</yellow>"
    custom-model-data: 0

  protect-disabled:
    material: "LEATHER"
    name: "<red>防止破坏: 关闭</red>"
    lore:
      - "<gray>当前状态: </gray><red>关闭</red>"
      - "<gray>点击切换防止破坏模式</gray>"
      - "<yellow>开启后告示牌不会被破坏</yellow>"
    custom-model-data: 0

  # 搜索按钮
  search:
    material: "COMPASS"
    name: "<gold>搜索音乐</gold>"
    lore:
      - "<gray>点击搜索音乐</gray>"
    custom-model-data: 0

  # 最近播放按钮
  recent-songs:
    material: "CLOCK"
    name: "<gold>最近播放</gold>"
    lore:
      - "<gray>最近播放：<yellow>{count}</yellow> <gray>首歌曲</gray>"
    custom-model-data: 0

  recent-songs-empty:
    material: "CLOCK"
    name: "<gold>最近播放</gold>"
    lore:
      - "<gray>当前没有最近播放记录</gray>"
    custom-model-data: 0

  # 特殊项目
  master-playlist:
    material: "ENCHANTED_BOOK"
    name: "<gold>主播放列表</gold>"
    lore:
      - "<gold>所有歌曲（随机打乱）</gold>"
    custom-model-data: 0

  # 告示牌设置按钮
  random-mode:
    material: "MUSIC_DISC_13"
    name: "<gold>随机模式: {status}</gold>"
    lore:
      - "<gray>点击切换随机播放模式</gray>"
      - "<gray>当前状态: {status}</gray>"
    custom-model-data: 0

  info-sign-mode:
    material: "OAK_SIGN"
    name: "<gold>信息告示牌: {status}</gold>"
    lore:
      - "<gold>当播放音乐时</gold>"
      - "<gold>显示歌曲信息</gold>"
    custom-model-data: 0

  prevent-destroy:
    material: "IRON_BLOCK"
    name: "<gold>防止破坏: {status}</gold>"
